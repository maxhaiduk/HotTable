title: Індекс на великій таблиці під навантаженням
table: orders
# Step 4 adds a partitioned copy; the panels show its locks and indexes, partitions included.
watch: [orders_part]

# Computed once when the load starts; the scripts use them as :name.
vars:
  max_order_id: SELECT max(id) FROM orders
  customers: SELECT max(id) FROM customers

load:
  - name: write
    workers: 4
    rate: 50
    scripts:
      - {file: load/update.sql, weight: 7}
      - {file: load/insert.sql, weight: 3}
  - name: read
    workers: 4
    rate: 50
    scripts:
      - {file: load/read.sql}
  - name: lookup
    workers: 1
    every: 3s
    # Without its index the lookup scans the whole table and normally takes a second or two.
    stuck_after: 5s
    scripts:
      - {file: load/lookup.sql}
  - name: write-part
    # New orders in orders_part all land in this year's partition. The group runs once step 4
    # has created the table and the load is started again.
    requires: orders_part
    workers: 2
    rate: 50
    scripts:
      - {file: load/insert_part.sql}
